name: Windows package check

on:
  pull_request:
    paths:
      - "web_ui.py"
      - "app_metadata.py"
      - "core/**"
      - "web/**"
      - "exporters/**"
      - "importers/**"
      - "tools/**"
      - "frontend/**"
      - "requirements-core.txt"
      - "requirements-webui.txt"
      - "scripts/build_release.ps1"
      - "scripts/release.ps1"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-package-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Apply fixed Angle Compression mode
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: python
        run: |
          from pathlib import Path

          p = Path("web/adofai.py")
          s = p.read_text(encoding="utf-8")
          marker = '            "targetBpm": max(1000.0, bpm * 10.0),\n'
          if '"angleCompressionMode"' not in s:
              if marker not in s:
                  raise SystemExit("default marker missing")
              s = s.replace(marker, marker + '            "angleCompressionMode": "auto",\n            "angleCompressionFixedAngle": 165.0,\n', 1)
          prep = '        song_offset_ms = auto_offset_ms if auto_song_offset else _as_float(raw.get("songOffsetMs"), auto_offset_ms, -3600000.0, 3600000.0)\n\n        opts = {\n'
          if 'angle_compression_mode = _choice' not in s:
              repl = '        song_offset_ms = auto_offset_ms if auto_song_offset else _as_float(raw.get("songOffsetMs"), auto_offset_ms, -3600000.0, 3600000.0)\n\n        method = _choice(raw.get("method"), {"rabbit_zip", "angle_only", "harmony"}, "rabbit_zip")\n        angle_compression_mode = _choice(raw.get("angleCompressionMode"), {"auto", "fixed"}, "auto")\n        angle_compression_fixed_angle = _as_float(raw.get("angleCompressionFixedAngle"), 165.0, 0.001, 359.999)\n        if method == "rabbit_zip" and angle_compression_mode == "fixed":\n            for note in notes:\n                note.target_angle = angle_compression_fixed_angle\n\n        opts = {\n'
              if prep not in s:
                  raise SystemExit("prepare marker missing")
              s = s.replace(prep, repl, 1)
              s = s.replace('            "method": _choice(raw.get("method"), {"rabbit_zip", "angle_only", "harmony"}, "rabbit_zip"),', '            "method": method,', 1)
          p.write_text(s, encoding="utf-8")

          p = Path("frontend/src/api/bridge.ts")
          s = p.read_text(encoding="utf-8")
          old = '  xMode: "floor" | "lowest_floor" | "round" | "ceil" | "fixed" | "target_bpm"; fixedX: number; targetBpm: number; maxTiles: number; maxTilesPerNote: number;\n'
          new = '  xMode: "floor" | "lowest_floor" | "round" | "ceil" | "fixed" | "target_bpm"; fixedX: number; targetBpm: number; angleCompressionMode: "auto" | "fixed"; angleCompressionFixedAngle: number; maxTiles: number; maxTilesPerNote: number;\n'
          if 'angleCompressionMode:' not in s:
              if old not in s:
                  raise SystemExit("bridge marker missing")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("frontend/src/dialogs/AdoFAIExportDialogJa.tsx")
          s = p.read_text(encoding="utf-8")
          old = '        {isZip&&<><Field label="Xの決め方"><Select value={options.xMode}'
          prefix = '        {isZip&&<><Field label="圧縮角度"><Select value={options.angleCompressionMode} options={[["auto","自動"],["fixed","固定角度"]]} onChange={v=>patch("angleCompressionMode",v as AdoFAIExportOptions["angleCompressionMode"])}/></Field>{options.angleCompressionMode==="fixed"&&<Field label="固定角度"><Num value={options.angleCompressionFixedAngle} min={.001} max={359.999} step={1} suffix="°" onChange={v=>patch("angleCompressionFixedAngle",v)}/></Field>}<Field label="Xの決め方"><Select value={options.xMode}'
          if 'label="圧縮角度"' not in s:
              if old not in s:
                  raise SystemExit("dialog marker missing")
              s = s.replace(old, prefix, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("tests/test_web_ui_compat.py")
          s = p.read_text(encoding="utf-8")
          if 'test_fixed_angle_compression_overrides_note_target_angle' not in s:
              marker = '    def test_spectrogram_render_contract(self):\n'
              test = '''    def test_fixed_angle_compression_overrides_note_target_angle(self):
        bridge = Bridge()
        from core.note_model import Note
        bridge.notes = [Note(0.0, 1.0, 69.0, target_angle=90.0)]
        notes, opts, _ = bridge._prepare_adofai_export({
            "method": "rabbit_zip",
            "angleCompressionMode": "fixed",
            "angleCompressionFixedAngle": 165.0,
            "baseBpm": 175.0,
        }, None)
        self.assertEqual(opts["method"], "rabbit_zip")
        self.assertAlmostEqual(notes[0].target_angle, 165.0)

    def test_spectrogram_render_contract(self):
'''
              if marker not in s:
                  raise SystemExit("test marker missing")
              s = s.replace(marker, test, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit fixed Angle Compression implementation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/adofai.py frontend/src/api/bridge.ts frontend/src/dialogs/AdoFAIExportDialogJa.tsx tests/test_web_ui_compat.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Add fixed Angle Compression output angle"
            git push origin HEAD:${{ github.head_ref }}
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: |
          python -m pip install --disable-pip-version-check uv
          uv --version

      - name: Validate PowerShell scripts
        shell: powershell
        run: |
          foreach ($path in @("scripts/build_release.ps1", "scripts/release.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              throw "$path contains PowerShell syntax errors."
            }
          }

      - name: Build packaged Web UI
        shell: powershell
        run: .\scripts\build_release.ps1 -Clean -NoZip

      - name: Verify packaged files
        shell: powershell
        run: |
          if (-not (Test-Path "dist\AdopyHzEditor\AdopyHzEditor.exe")) {
            throw "Packaged executable is missing."
          }
          $indexes = @(
            "dist\AdopyHzEditor\_internal\frontend\dist\index.html",
            "dist\AdopyHzEditor\frontend\dist\index.html"
          )
          if (-not ($indexes | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            throw "Packaged React UI is missing."
          }
          if (Test-Path "dist\AdopyHzEditor\_internal\pythonnet\runtime\Python.Runtime.dll") {
            throw "Packaged executable still contains the pythonnet runtime DLL."
          }

      - name: Smoke-test packaged executable
        shell: powershell
        run: |
          $exe = (Resolve-Path "dist\AdopyHzEditor\AdopyHzEditor.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "Packaged Web UI exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
