name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: |
          python -m pip install --disable-pip-version-check uv
          uv --version

      - name: Verify release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $actual = (& python -c "import app_metadata; print(app_metadata.APP_VERSION)").Trim()
          if ($actual -ne $version) {
            throw "Tag version $version does not match app_metadata.py version $actual."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Windows Web UI release
        shell: pwsh
        run: .\scripts\build_release.ps1 -Clean -Version $env:RELEASE_VERSION

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = "releases\AdopyHzEditor_Windows_${{ github.ref_name }}.zip"
          if (-not (Test-Path $zip)) {
            throw "Release ZIP was not created: $zip"
          }
          gh release create "${{ github.ref_name }}" $zip --title "AdopyHzEditor ${{ github.ref_name }}" --generate-notes
