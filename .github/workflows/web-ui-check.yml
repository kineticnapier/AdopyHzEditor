name: Web UI check

on:
  push:
    branches: [ts-ui-prototype]
  pull_request:
    paths:
      - "frontend/**"
      - "web_ui.py"
      - "web_backend*.py"
      - "run-webui.ps1"
      - "run-webui.cmd"
      - ".github/workflows/web-ui-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: >-
          python -m compileall -q
          web_ui.py
          web_backend.py
          web_backend_adofai.py
          web_backend_editing.py
          web_backend_io.py
          web_backend_notes.py
          web_backend_presets.py
          web_backend_tools.py

      - name: Web UI bridge MRO
        shell: python
        run: |
          import ast
          from pathlib import Path

          def class_bases(path, class_name):
              tree = ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and node.name == class_name:
                      result = []
                      for base in node.bases:
                          if isinstance(base, ast.Name):
                              result.append(base.id)
                          elif isinstance(base, ast.Attribute):
                              result.append(base.attr)
                          else:
                              raise SystemExit(f"Unsupported base expression in {path}: {ast.dump(base)}")
                      return result
              raise SystemExit(f"Class {class_name} not found in {path}")

          core_names = class_bases("web_backend.py", "Bridge")
          web_names = class_bases("web_ui.py", "Bridge")
          leaf_names = set(core_names + web_names) - {"CoreBridge"}
          leaf = {name: type(name, (), {}) for name in leaf_names}
          CoreBridge = type("CoreBridge", tuple(leaf[name] for name in core_names), {})
          resolved = {**leaf, "CoreBridge": CoreBridge}
          # Creating the class is enough to make Python validate C3 MRO consistency.
          type("WebBridge", tuple(resolved[name] for name in web_names), {})

      - name: Launcher is Windows PowerShell 5.1 safe
        shell: python
        run: |
          from pathlib import Path
          data = Path("run-webui.ps1").read_bytes()
          if any(byte >= 0x80 for byte in data):
              raise SystemExit("run-webui.ps1 must stay ASCII-only for Windows PowerShell 5.1")

      - name: PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "run-webui.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
