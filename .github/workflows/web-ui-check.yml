name: Web UI check

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    paths:
      - "frontend/**"
      - "web_ui.py"
      - "main.py"
      - "web/**"
      - "core/**"
      - "exporters/**"
      - "importers/**"
      - "tools/**"
      - "desktop/**"
      - "tests/**"
      - "scripts/**"
      - "run-webui.ps1"
      - "run-webui.cmd"
      - ".github/workflows/web-ui-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: >-
          python -m compileall -q
          main.py
          web_ui.py
          core
          exporters
          importers
          tools
          desktop
          web
          tests
          scripts

      - name: No legacy root import shims
        shell: python
        run: |
          import ast
          from pathlib import Path

          legacy_modules = {
              "audio_analysis", "audio_player", "note_model", "project_io",
              "export_adofai", "export_midi", "adofai_angles", "rabbit_zip_formula",
              "midi_import", "quick_hz_tools", "editor_view", "export_adofai_dialog",
              "help_dialog", "midi_import_dialog", "quick_hz_tools_dialog",
              "tile_preview_dialog", "toolbox_fix", "ui_final_tweaks", "ui_modern",
              "ui_polish", "update_manager", "web_backend_editing", "web_backend_io",
              "web_backend_notes",
          }
          root_shims = {
              "audio_analysis.py", "audio_player.py", "note_model.py", "project_io.py",
              "export_adofai.py", "export_midi.py", "adofai_angles.py", "rabbit_zip_formula.py",
              "midi_import.py", "quick_hz_tools.py", "editor_view.py", "export_adofai_dialog.py",
              "help_dialog.py", "midi_import_dialog.py", "quick_hz_tools_dialog.py",
              "tile_preview_dialog.py", "toolbox_fix.py", "ui_final_tweaks.py", "ui_modern.py",
              "ui_polish.py", "update_manager.py",
          }

          errors = []
          for name in sorted(root_shims):
              if Path(name).exists():
                  errors.append(f"legacy root shim still exists: {name}")

          for path in sorted(Path(".").rglob("*.py")):
              if ".git" in path.parts:
                  continue
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module in legacy_modules:
                      errors.append(f"{path}:{node.lineno}: from {node.module} import ...")
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name in legacy_modules:
                              errors.append(f"{path}:{node.lineno}: import {alias.name}")

          if errors:
              raise SystemExit("Legacy imports remain:\n" + "\n".join(errors))

      - name: Web UI bridge MRO
        shell: python
        run: |
          import ast
          from pathlib import Path

          def class_bases(path, class_name):
              tree = ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and node.name == class_name:
                      result = []
                      for base in node.bases:
                          if isinstance(base, ast.Name):
                              result.append(base.id)
                          elif isinstance(base, ast.Attribute):
                              result.append(base.attr)
                          else:
                              raise SystemExit(f"Unsupported base expression in {path}: {ast.dump(base)}")
                      return result
              raise SystemExit(f"Class {class_name} not found in {path}")

          core_names = class_bases("web/backend.py", "Bridge")
          web_names = class_bases("web_ui.py", "Bridge")
          leaf_names = set(core_names + web_names) - {"CoreBridge"}
          leaf = {name: type(name, (), {}) for name in leaf_names}
          CoreBridge = type("CoreBridge", tuple(leaf[name] for name in core_names), {})
          resolved = {**leaf, "CoreBridge": CoreBridge}
          type("WebBridge", tuple(resolved[name] for name in web_names), {})

      - name: Install lightweight Web runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy mido pywebview

      - name: Web UI bridge initialization
        run: |
          python - <<'PY'
          from web_ui import Bridge

          bridge = Bridge()
          state = bridge.get_state()
          assert bridge.ping()["ok"] is True
          assert state["playback"]["duration"] > 0
          assert state["settings"]["speed"] == 1.0
          PY

      - name: Launcher is Windows PowerShell 5.1 safe
        shell: python
        run: |
          from pathlib import Path
          data = Path("run-webui.ps1").read_bytes()
          if any(byte >= 0x80 for byte in data):
              raise SystemExit("run-webui.ps1 must stay ASCII-only for Windows PowerShell 5.1")

      - name: PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "run-webui.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
