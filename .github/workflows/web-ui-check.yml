name: Web UI check

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    paths:
      - "frontend/**"
      - "web_ui.py"
      - "web/**"
      - "core/**"
      - "exporters/**"
      - "importers/**"
      - "tools/**"
      - "desktop/**"
      - "*.py"
      - "run-webui.ps1"
      - "run-webui.cmd"
      - ".github/workflows/web-ui-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: >-
          python -m compileall -q
          web_ui.py
          main.py
          web
          core
          exporters
          importers
          tools
          desktop
          audio_analysis.py
          audio_player.py
          note_model.py
          project_io.py
          export_adofai.py
          export_midi.py
          midi_import.py
          quick_hz_tools.py
          adofai_angles.py
          rabbit_zip_formula.py

      - name: Web UI bridge MRO
        shell: python
        run: |
          import ast
          from pathlib import Path

          def class_bases(path, class_name):
              tree = ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and node.name == class_name:
                      result = []
                      for base in node.bases:
                          if isinstance(base, ast.Name):
                              result.append(base.id)
                          elif isinstance(base, ast.Attribute):
                              result.append(base.attr)
                          else:
                              raise SystemExit(f"Unsupported base expression in {path}: {ast.dump(base)}")
                      return result
              raise SystemExit(f"Class {class_name} not found in {path}")

          core_names = class_bases("web/backend.py", "Bridge")
          web_names = class_bases("web_ui.py", "Bridge")
          leaf_names = set(core_names + web_names) - {"CoreBridge"}
          leaf = {name: type(name, (), {}) for name in leaf_names}
          CoreBridge = type("CoreBridge", tuple(leaf[name] for name in core_names), {})
          resolved = {**leaf, "CoreBridge": CoreBridge}
          type("WebBridge", tuple(resolved[name] for name in web_names), {})

      - name: Install lightweight Web runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy mido pywebview

      - name: Compatibility module aliases
        run: |
          python - <<'PY'
          import adofai_angles
          import audio_analysis
          import audio_player
          import export_adofai
          import export_midi
          import midi_import
          import note_model
          import project_io
          import quick_hz_tools
          import rabbit_zip_formula

          from core import audio_analysis as core_audio_analysis
          from core import audio_player as core_audio_player
          from core import note_model as core_note_model
          from core import project_io as core_project_io
          from exporters import adofai as exporters_adofai
          from exporters import adofai_angles as exporters_adofai_angles
          from exporters import midi as exporters_midi
          from exporters import rabbit_zip_formula as exporters_rabbit_zip_formula
          from importers import midi as importers_midi
          from tools import quick_hz as tools_quick_hz

          assert audio_analysis is core_audio_analysis
          assert audio_player is core_audio_player
          assert note_model is core_note_model
          assert project_io is core_project_io
          assert export_adofai is exporters_adofai
          assert export_midi is exporters_midi
          assert adofai_angles is exporters_adofai_angles
          assert rabbit_zip_formula is exporters_rabbit_zip_formula
          assert midi_import is importers_midi
          assert quick_hz_tools is tools_quick_hz
          PY

      - name: Web UI bridge initialization
        run: |
          python - <<'PY'
          from web_ui import Bridge

          bridge = Bridge()
          state = bridge.get_state()
          assert bridge.ping()["ok"] is True
          assert state["playback"]["duration"] > 0
          assert state["settings"]["speed"] == 1.0
          PY

      - name: Launcher is Windows PowerShell 5.1 safe
        shell: python
        run: |
          from pathlib import Path
          data = Path("run-webui.ps1").read_bytes()
          if any(byte >= 0x80 for byte in data):
              raise SystemExit("run-webui.ps1 must stay ASCII-only for Windows PowerShell 5.1")

      - name: PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "run-webui.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
