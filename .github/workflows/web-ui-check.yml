name: Web UI check

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    paths:
      - "frontend/**"
      - "web_ui.py"
      - "main.py"
      - "web/**"
      - "core/**"
      - "exporters/**"
      - "importers/**"
      - "tools/**"
      - "desktop/**"
      - "tests/**"
      - "scripts/**"
      - "run-webui.ps1"
      - "run-webui.cmd"
      - ".github/workflows/web-ui-check.yml"

permissions:
  contents: write

jobs:
  migrate_fixed_angle:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply fixed Angle Compression mode
        shell: python
        run: |
          from pathlib import Path

          p = Path("web/adofai.py")
          s = p.read_text(encoding="utf-8")
          marker = '            "targetBpm": max(1000.0, bpm * 10.0),\n'
          if '"angleCompressionMode"' not in s:
              if marker not in s:
                  raise SystemExit("default marker missing")
              s = s.replace(marker, marker + '            "angleCompressionMode": "auto",\n            "angleCompressionFixedAngle": 165.0,\n', 1)

          prep = '        song_offset_ms = auto_offset_ms if auto_song_offset else _as_float(raw.get("songOffsetMs"), auto_offset_ms, -3600000.0, 3600000.0)\n\n        opts = {\n'
          if 'angle_compression_mode = _choice' not in s:
              repl = '        song_offset_ms = auto_offset_ms if auto_song_offset else _as_float(raw.get("songOffsetMs"), auto_offset_ms, -3600000.0, 3600000.0)\n\n        method = _choice(raw.get("method"), {"rabbit_zip", "angle_only", "harmony"}, "rabbit_zip")\n        angle_compression_mode = _choice(raw.get("angleCompressionMode"), {"auto", "fixed"}, "auto")\n        angle_compression_fixed_angle = _as_float(raw.get("angleCompressionFixedAngle"), 165.0, 0.001, 359.999)\n        if method == "rabbit_zip" and angle_compression_mode == "fixed":\n            for note in notes:\n                note.target_angle = angle_compression_fixed_angle\n\n        opts = {\n'
              if prep not in s:
                  raise SystemExit("prepare marker missing")
              s = s.replace(prep, repl, 1)
              s = s.replace('            "method": _choice(raw.get("method"), {"rabbit_zip", "angle_only", "harmony"}, "rabbit_zip"),', '            "method": method,', 1)
          p.write_text(s, encoding="utf-8")

          p = Path("frontend/src/api/bridge.ts")
          s = p.read_text(encoding="utf-8")
          old = '  xMode: "floor" | "lowest_floor" | "round" | "ceil" | "fixed" | "target_bpm"; fixedX: number; targetBpm: number; maxTiles: number; maxTilesPerNote: number;\n'
          new = '  xMode: "floor" | "lowest_floor" | "round" | "ceil" | "fixed" | "target_bpm"; fixedX: number; targetBpm: number; angleCompressionMode: "auto" | "fixed"; angleCompressionFixedAngle: number; maxTiles: number; maxTilesPerNote: number;\n'
          if 'angleCompressionMode:' not in s:
              if old not in s:
                  raise SystemExit("bridge marker missing")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("frontend/src/dialogs/AdoFAIExportDialogJa.tsx")
          s = p.read_text(encoding="utf-8")
          old = '        {isZip&&<><Field label="Xの決め方"><Select value={options.xMode}'
          prefix = '        {isZip&&<><Field label="圧縮角度"><Select value={options.angleCompressionMode} options={[["auto","自動"],["fixed","固定角度"]]} onChange={v=>patch("angleCompressionMode",v as AdoFAIExportOptions["angleCompressionMode"])}/></Field>{options.angleCompressionMode==="fixed"&&<Field label="固定角度"><Num value={options.angleCompressionFixedAngle} min={.001} max={359.999} step={1} suffix="°" onChange={v=>patch("angleCompressionFixedAngle",v)}/></Field>}<Field label="Xの決め方"><Select value={options.xMode}'
          if 'label="圧縮角度"' not in s:
              if old not in s:
                  raise SystemExit("dialog marker missing")
              s = s.replace(old, prefix, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("tests/test_web_ui_compat.py")
          s = p.read_text(encoding="utf-8")
          if 'test_fixed_angle_compression_overrides_note_target_angle' not in s:
              marker = '    def test_spectrogram_render_contract(self):\n'
              test = '''    def test_fixed_angle_compression_overrides_note_target_angle(self):
        bridge = Bridge()
        from core.note_model import Note
        bridge.notes = [Note(0.0, 1.0, 69.0, target_angle=90.0)]
        notes, opts, _ = bridge._prepare_adofai_export({
            "method": "rabbit_zip",
            "angleCompressionMode": "fixed",
            "angleCompressionFixedAngle": 165.0,
            "baseBpm": 175.0,
        }, None)
        self.assertEqual(opts["method"], "rabbit_zip")
        self.assertAlmostEqual(notes[0].target_angle, 165.0)

    def test_spectrogram_render_contract(self):
'''
              if marker not in s:
                  raise SystemExit("test marker missing")
              s = s.replace(marker, test, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/adofai.py frontend/src/api/bridge.ts frontend/src/dialogs/AdoFAIExportDialogJa.tsx tests/test_web_ui_compat.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add fixed Angle Compression output angle"
          git push origin HEAD:${{ github.head_ref }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: >-
          python -m compileall -q
          main.py
          web_ui.py
          core
          exporters
          importers
          tools
          desktop
          web
          tests
          scripts

      - name: No legacy root import shims
        shell: python
        run: |
          import ast
          from pathlib import Path

          legacy_modules = {
              "audio_analysis", "audio_player", "note_model", "project_io",
              "export_adofai", "export_midi", "adofai_angles", "rabbit_zip_formula",
              "midi_import", "quick_hz_tools", "editor_view", "export_adofai_dialog",
              "help_dialog", "midi_import_dialog", "quick_hz_tools_dialog",
              "tile_preview_dialog", "toolbox_fix", "ui_final_tweaks", "ui_modern",
              "ui_polish", "update_manager", "web_backend_editing", "web_backend_io",
              "web_backend_notes",
          }
          root_shims = {
              "audio_analysis.py", "audio_player.py", "note_model.py", "project_io.py",
              "export_adofai.py", "export_midi.py", "adofai_angles.py", "rabbit_zip_formula.py",
              "midi_import.py", "quick_hz_tools.py", "editor_view.py", "export_adofai_dialog.py",
              "help_dialog.py", "midi_import_dialog.py", "quick_hz_tools_dialog.py",
              "tile_preview_dialog.py", "toolbox_fix.py", "ui_final_tweaks.py", "ui_modern.py",
              "ui_polish.py", "update_manager.py",
          }

          errors = []
          for name in sorted(root_shims):
              if Path(name).exists():
                  errors.append(f"legacy root shim still exists: {name}")

          for path in sorted(Path(".").rglob("*.py")):
              if ".git" in path.parts:
                  continue
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module in legacy_modules:
                      errors.append(f"{path}:{node.lineno}: from {node.module} import ...")
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name in legacy_modules:
                              errors.append(f"{path}:{node.lineno}: import {alias.name}")

          if errors:
              raise SystemExit("Legacy imports remain:\n" + "\n".join(errors))

      - name: Web UI bridge MRO
        shell: python
        run: |
          import ast
          from pathlib import Path

          def class_bases(path, class_name):
              tree = ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and node.name == class_name:
                      result = []
                      for base in node.bases:
                          if isinstance(base, ast.Name):
                              result.append(base.id)
                          elif isinstance(base, ast.Attribute):
                              result.append(base.attr)
                          else:
                              raise SystemExit(f"Unsupported base expression in {path}: {ast.dump(base)}")
                      return result
              raise SystemExit(f"Class {class_name} not found in {path}")

          core_names = class_bases("web/backend.py", "Bridge")
          web_names = class_bases("web_ui.py", "Bridge")
          leaf_names = set(core_names + web_names) - {"CoreBridge"}
          leaf = {name: type(name, (), {}) for name in leaf_names}
          CoreBridge = type("CoreBridge", tuple(leaf[name] for name in core_names), {})
          resolved = {**leaf, "CoreBridge": CoreBridge}
          type("WebBridge", tuple(resolved[name] for name in web_names), {})

      - name: Install lightweight Web runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy mido pywebview

      - name: Web UI bridge initialization
        run: |
          python - <<'PY'
          from web_ui import Bridge

          bridge = Bridge()
          state = bridge.get_state()
          assert bridge.ping()["ok"] is True
          assert state["playback"]["duration"] > 0
          assert state["settings"]["speed"] == 1.0
          PY

      - name: Launcher is Windows PowerShell 5.1 safe
        shell: python
        run: |
          from pathlib import Path
          data = Path("run-webui.ps1").read_bytes()
          if any(byte >= 0x80 for byte in data):
              raise SystemExit("run-webui.ps1 must stay ASCII-only for Windows PowerShell 5.1")

      - name: PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "run-webui.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
