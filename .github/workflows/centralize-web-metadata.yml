name: Centralize Web metadata

on:
  push:
    branches: ["refactor/project-structure"]
    paths:
      - ".github/workflows/centralize-web-metadata.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Update Web metadata imports
        shell: python
        run: |
          from pathlib import Path

          path = Path("web/adofai.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from i18n import tr\n"
          new_import = "from app_metadata import APP_VERSION, GITHUB_RELEASES_URL\nfrom i18n import tr\n"
          old_constants = '\nAPP_VERSION = "0.7.2"\nGITHUB_RELEASES_URL = "https://github.com/kineticnapier/AdopyHzEditor/releases"\n'

          if old_import not in text or old_constants not in text:
              raise SystemExit("Expected Web metadata literals were not found.")

          text = text.replace(old_import, new_import, 1)
          text = text.replace(old_constants, "\n", 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/adofai.py
          git commit -m "Use shared metadata in Web UI"
          git push origin HEAD:${{ github.ref_name }}
